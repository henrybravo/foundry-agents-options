# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: trail-deepagents
services:
    ai-project:
        host: azure.ai.project
        # The model deployments all four agents can use. Pick one per deploy
        # with scripts\deploy.ps1 -Model; deployment name = model name.
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 50
                name: GlobalStandard
            - model:
                format: OpenAI
                name: gpt-6-sol
                version: "2026-09-22"
              name: gpt-6-sol
              sku:
                capacity: 50
                name: GlobalStandard
            - model:
                format: OpenAI
                name: gpt-5.6-sol
                version: "2026-07-09"
              name: gpt-5.6-sol
              sku:
                capacity: 50
                name: GlobalStandard
    trail-deepagents:
        project: src/trail-deepagents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            # Foundry toolbox MCP URL that serves the trail-review skill;
            # empty uses the bundled copy. Set by scripts\publish-skill.ps1.
            TOOLBOX_ENDPOINT: ${TRAIL_TOOLBOX_ENDPOINT}
            # Stops the exporter's usage telemetry from probing the VM metadata
            # endpoint, which hosted containers cannot reach.
            APPLICATIONINSIGHTS_STATSBEAT_DISABLED_ALL: "true"
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Deep Agents harness on LangGraph that reviews a group hike proposal using the shared trail-review skill.
        displayName: Trail review demo - Deep Agents harness (LangGraph)
        kind: hosted
        metadata:
            tags:
                - LangGraph
                - LangChain
                - Deep Agents
                - Harness
                - Responses Protocol
                - Python
        name: trail-deepagents
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
