# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: trail-langgraph-workflow
services:
    ai-project:
        host: azure.ai.project
        deployments: []
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
    trail-langgraph-workflow:
        project: src/trail-langgraph-workflow
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            # Foundry toolbox MCP URL that serves the trail-review skill;
            # empty uses the bundled copy. Set by scripts\publish-skill.ps1.
            TOOLBOX_ENDPOINT: ${TRAIL_TOOLBOX_ENDPOINT}
            # Stops the exporter's usage telemetry from probing the VM metadata
            # endpoint, which hosted containers cannot reach.
            APPLICATIONINSIGHTS_STATSBEAT_DISABLED_ALL: "true"
        codeConfiguration:
            entryPoint: -m langchain_azure_ai.agents.hosting.run --protocol responses
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Fixed LangGraph workflow (safety, environment, summarizer) that reviews a group hike proposal using the shared trail-review skill files.
        displayName: Trail review demo - LangGraph workflow
        kind: hosted
        metadata:
            tags:
                - LangGraph
                - LangChain
                - Workflow
                - Responses Protocol
                - Python
        name: trail-langgraph-workflow
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
